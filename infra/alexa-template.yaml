AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Alexa Custom Skill adapter for the Loose Ends AgentCore runtime.

Parameters:
  AlexaSkillId:
    Type: String
    AllowedPattern: "^amzn1\\.ask\\.skill\\.[A-Za-z0-9-]+$"
  AgentRuntimeArn:
    Type: String
    AllowedPattern: "^arn:aws[a-zA-Z-]*:bedrock-agentcore:[a-z0-9-]+:[0-9]{12}:runtime/.+$"
  UserTimezone:
    Type: String
    Default: America/New_York

Resources:
  AlexaAdapter:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: loose-ends-alexa-adapter
      Description: Thin Alexa adapter for the Loose Ends AgentCore runtime.
      CodeUri: ../alexa/
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
          ALEXA_SKILL_ID: !Ref AlexaSkillId
          LOOSE_ENDS_TIMEZONE: !Ref UserTimezone
      Policies:
        - Statement:
            - Sid: InvokeLooseEndsRuntime
              Effect: Allow
              Action:
                - bedrock-agentcore:InvokeAgentRuntime
                - bedrock-agentcore:InvokeAgentRuntimeForUser
              Resource:
                - !Ref AgentRuntimeArn
                - !Sub "${AgentRuntimeArn}/runtime-endpoint/*"
      Events:
        AlexaSkill:
          Type: AlexaSkill
          Properties:
            SkillId: !Ref AlexaSkillId

Outputs:
  AlexaLambdaArn:
    Description: Paste this ARN into the Alexa Developer Console endpoint.
    Value: !GetAtt AlexaAdapter.Arn
